# K2-OpenHost: build only the Creality K2 package of this fork.
# Same steps as the K2 leg of release.yml. A push to k2-openhost with a new
# fork version (VERSION.txt + VERSION-k2oh.txt, e.g. v1.0.6-k2oh.2) publishes
# it as a GitHub release, which HelixScreen's in-app update installs.
name: K2-OpenHost build

on:
  push:
    branches: [k2-openhost]
  pull_request:
    branches: [k2-openhost]
  workflow_dispatch:

concurrency:
  group: k2-openhost-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The CFS backend tests, with the dependencies of build.yml's compile job.
  test-cfs:
    name: Test (CFS backend)
    runs-on: ubuntu-22.04
    timeout-minutes: 200
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: false

    - name: Initialize submodules
      uses: ./.github/actions/init-submodules

    - name: Prepare apt
      uses: ./.github/actions/apt-prepare

    - name: Install dependencies
      run: |
        sudo rm -f /etc/apt/sources.list.d/google-chrome*.list
        sudo apt-get update
        sudo apt-get install -y libsdl2-dev clang make python3 python3-venv npm \
          libssl-dev pkg-config libfmt-dev libcairo2-dev libpango1.0-dev libpng-dev \
          libjpeg-dev libnl-3-dev libnl-genl-3-dev libxml2-utils libusb-1.0-0-dev \
          libsystemd-dev libbluetooth-dev ccache

    - name: Restore ccache
      uses: actions/cache/restore@v5
      with:
        path: ~/.cache/ccache
        key: ccache-k2openhost-tests-${{ github.sha }}
        restore-keys: |
          ccache-k2openhost-tests-

    - name: Install Node.js dependencies
      run: npm install

    - name: Setup Python venv
      run: make venv-setup

    - name: Build tests
      env:
        CC: ccache clang
        CXX: ccache clang++
      run: |
        ccache --set-config=max_size=2G
        ccache --set-config=compression=true
        # The patches add libhv sources (dns_resolv.c) that `make test` lists
        # before it applies them; build.yml gets them from its full `make` first.
        make apply-patches
        make test -j$(nproc)

    - name: Save ccache
      if: always()
      uses: actions/cache/save@v5
      with:
        path: ~/.cache/ccache
        key: ccache-k2openhost-tests-${{ github.sha }}

    - name: Run CFS and K2-OpenHost tests
      run: ./build/bin/helix-tests "[cfs],[k2oh]"

  build-k2:
    name: Build (Creality K2)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: false

    - name: Initialize submodules
      uses: ./.github/actions/init-submodules

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Restore ccache
      uses: actions/cache@v5
      with:
        path: /tmp/.ccache-k2
        key: ccache-k2openhost-${{ github.sha }}
        restore-keys: |
          ccache-k2openhost-

    - name: Configure ccache
      run: |
        mkdir -p /tmp/.ccache-k2
        printf 'max_size = 2G\ncompression = true\n' > /tmp/.ccache-k2/ccache.conf

    - name: Build k2 toolchain image
      run: |
        docker buildx build \
          --cache-from type=gha,scope=toolchain-k2 \
          --cache-to type=gha,mode=max,scope=toolchain-k2 \
          --load \
          -t helixscreen/toolchain-k2 \
          -f docker/Dockerfile.k2 \
          docker/

    - name: Cross-compile for the K2
      run: |
        docker run --rm \
          -v "${{ github.workspace }}":/src \
          -v /tmp/.ccache-k2:/root/.cache/ccache \
          -e CCACHE_DIR=/root/.cache/ccache \
          -w /src \
          helixscreen/toolchain-k2 \
          make PLATFORM_TARGET=k2 HELIX_PACKAGING=1 SKIP_OPTIONAL_DEPS=1 -j$(nproc)

    - name: Fix build directory ownership
      run: sudo chown -R $(id -u):$(id -g) build/

    - name: Generate pre-rendered images
      run: make venv-setup && make gen-all-images

    - name: Package K2 release
      run: make release-k2

    - name: Upload K2 package
      uses: actions/upload-artifact@v7
      with:
        name: helixscreen-k2-openhost
        path: |
          releases/helixscreen-k2-*.tar.gz
          releases/helixscreen-k2.zip
        retention-days: 30

  release:
    name: Publish the fork release
    if: github.event_name == 'push' && github.ref == 'refs/heads/k2-openhost'
    needs: [test-cfs, build-k2]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Download K2 package
      uses: actions/download-artifact@v5
      with:
        name: helixscreen-k2-openhost
        path: releases

    - name: Create the release if this version is new
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        tag="v$(cat VERSION.txt)-$(cat VERSION-k2oh.txt)"
        if gh release view "$tag" >/dev/null 2>&1; then
          echo "$tag already released; bump VERSION-k2oh.txt to publish a new build"
          exit 0
        fi
        # install.sh is a separate asset: the K2-OpenHost installer helper
        # downloads it next to the tar.gz, as it did from upstream's releases.
        notes="K2-OpenHost build of HelixScreen $(cat VERSION.txt). Changes: the commits since the previous release."
        gh release create "$tag" --target "$GITHUB_SHA" --title "HelixScreen $tag (K2-OpenHost)" \
          --notes "$notes" \
          releases/helixscreen-k2-*.tar.gz releases/helixscreen-k2.zip scripts/install.sh
